version: "3.8"

services:
  vinted-bot:
    build: .
    container_name: vintedmandos-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      # Persistir el archivo de IDs vistos entre reinicios
      - ./seen_items.json:/app/seen_items.json
      - ./bot.log:/app/bot.log
    environment:
      - TZ=Europe/Madrid
