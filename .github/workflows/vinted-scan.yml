name: VintedMandos Scan

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: vinted-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen items cache
        uses: actions/cache@v4
        with:
          path: data
          key: vinted-seen-${{ github.run_id }}
          restore-keys: |
            vinted-seen-

      - name: Scan Vinted
        id: scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRICE: '23.00'
        run: python vinted_monitor.py 2>&1 | tee scan_output.txt
        continue-on-error: true

      - name: Show scan output
        if: always()
        run: |
          echo "=== SCAN OUTPUT ==="
          cat scan_output.txt 2>/dev/null || echo "No output captured"
          echo "=== EXIT CODE ==="
          echo "${{ steps.scan.outcome }}"

      - name: Fail if scan failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
