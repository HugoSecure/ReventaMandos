# GitHub Actions workflow: escanea Vinted cada 5 minutos
# Gratis siempre con repositorio público (minutos ilimitados)

name: VintedMandos Scan

on:
  # Ejecutar cada 5 minutos con cron
  schedule:
    - cron: '*/5 * * * *'

  # Permitir ejecución manual desde GitHub
  workflow_dispatch:

# Evitar ejecuciones simultáneas
concurrency:
  group: vinted-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Clonar el repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # Configurar Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Instalar dependencias
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Restaurar caché de IDs vistos (persiste entre ejecuciones)
      - name: Restore seen items cache
        uses: actions/cache@v4
        with:
          path: data
          key: vinted-seen-${{ github.run_id }}
          restore-keys: |
            vinted-seen-

      # Ejecutar el escaneo
      - name: Scan Vinted
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRICE: '23.00'
        run: python vinted_monitor.py
