name: VintedMandos Scan

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: vinted-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen items cache
        uses: actions/cache@v4
        with:
          path: data
          key: vinted-seen-${{ github.run_id }}
          restore-keys: |
            vinted-seen-

      - name: Verify secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "TOKEN_SET=$(python -c "import os; print('yes' if os.getenv('TELEGRAM_BOT_TOKEN') else 'no')")"
          echo "CHAT_SET=$(python -c "import os; print('yes' if os.getenv('TELEGRAM_CHAT_ID') else 'no')")"
          python -c "
          import os
          t = os.getenv('TELEGRAM_BOT_TOKEN','')
          c = os.getenv('TELEGRAM_CHAT_ID','')
          if not t or not c:
              print(f'ERROR: Token={len(t)} chars, ChatID={len(c)} chars. Configure secrets in Settings > Secrets!')
              raise SystemExit(1)
          print(f'OK: Token={len(t)} chars, ChatID={len(c)} chars')
          "

      - name: Scan Vinted
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_PRICE: '23.00'
        run: python vinted_monitor.py
